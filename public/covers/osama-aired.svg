<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- AIRED stand-in cover for Osama Osama's album (AIRED-0079). His own upload
       is kept untouched in storage; globals.css shows this in its place. -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="46%" r="70%">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="0.18" stop-color="#d9433a"/>
      <stop offset="0.45" stop-color="#5a1430"/>
      <stop offset="0.75" stop-color="#1a0d24"/>
      <stop offset="1" stop-color="#08070c"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset="0.35" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#c3c7d0"/>
      <stop offset="1" stop-color="#eef0f4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#sky)"/>
  <!-- sound rings that breathe outward -->
  <g fill="none" stroke="#e6c27a" stroke-width="2" filter="url(#glow)">
    <circle cx="300" cy="276" r="90" opacity="0.9">
      <animate attributeName="r" values="90;250" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="276" r="90" opacity="0.9">
      <animate attributeName="r" values="90;250" dur="6s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="6s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="276" r="90" opacity="0.9" stroke="#47a8ff">
      <animate attributeName="r" values="90;250" dur="6s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="6s" begin="-4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="300" cy="276" r="120" fill="url(#sun)" opacity="0.55">
    <animate attributeName="opacity" values="0.45;0.7;0.45" dur="5s" repeatCount="indefinite"/>
  </circle>
  <!-- headphones, polished silver -->
  <g fill="none" stroke="url(#silver)" stroke-linecap="round" filter="url(#glow)">
    <path d="M200 300 V270 a100 100 0 0 1 200 0 V300" stroke-width="14"/>
  </g>
  <g fill="url(#silver)" filter="url(#glow)">
    <rect x="178" y="286" width="46" height="78" rx="20"/>
    <rect x="376" y="286" width="46" height="78" rx="20"/>
  </g>
  <!-- equaliser between the ear cups -->
  <g fill="#ffe2a8">
    <rect x="248" y="300" width="10" height="40" rx="5"><animate attributeName="height" values="20;56;28;20" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="310;292;306;310" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="270" y="290" width="10" height="60" rx="5"><animate attributeName="height" values="60;24;48;60" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="290;308;296;290" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="292" y="282" width="10" height="76" rx="5"><animate attributeName="height" values="76;40;66;76" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="282;300;287;282" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="314" y="292" width="10" height="56" rx="5"><animate attributeName="height" values="30;62;22;30" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="305;289;309;305" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="336" y="302" width="10" height="36" rx="5"><animate attributeName="height" values="36;18;50;36" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="302;311;295;302" dur="1.7s" repeatCount="indefinite"/></rect>
  </g>
  <text x="300" y="560" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" letter-spacing="12" fill="#f4f1ea" opacity="0.92">AIRED</text>
  <rect x="268" y="570" width="62" height="2" rx="1" fill="#ff2d2d"/>
</svg>
